name: Versions

# Après la CI verte d'un push sur main, crée le tag vX.Y.Z et la release GitHub.
# La version suit les titres de commits (Conventional Commits) depuis le dernier tag :
# - « type!: … » ou « BREAKING CHANGE » dans le corps : version majeure ;
# - « feat: … » : version mineure ;
# - « fix: … » ou « perf: … » : correctif ;
# - le reste (docs, chore, ci, test…) ne crée pas de version.
# Les notes de la release listent les PR fusionnées, donc les issues qu'elles ferment.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Calculer la prochaine version
        id: version
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          log=$(git log --format='%s%n%b' "${last:+$last..}HEAD")
          if grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE' <<<"$log"; then bump=major
          elif grep -qE '^feat(\([^)]*\))?:' <<<"$log"; then bump=minor
          elif grep -qE '^(fix|perf)(\([^)]*\))?:' <<<"$log"; then bump=patch
          else
            echo "Aucun feat, fix ou perf depuis ${last:-le début} : pas de nouvelle version."
            exit 0
          fi
          IFS=. read -r major minor patch <<<"${last#v}"
          major=${major:-0} minor=${minor:-0} patch=${patch:-0}
          case $bump in
            major) major=$((major + 1)) minor=0 patch=0 ;;
            minor) minor=$((minor + 1)) patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          echo "tag=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "${last:-aucun tag} → v$major.$minor.$patch ($bump)"
      - name: Créer le tag et la release
        if: steps.version.outputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$HEAD_SHA" --title "$TAG" --generate-notes
          echo "### Version $TAG publiée" >> "$GITHUB_STEP_SUMMARY"
