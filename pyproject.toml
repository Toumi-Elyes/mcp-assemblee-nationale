[project]
name = "mcp-assemblee-nationale"
version = "0.1.0"
description = "Serveur MCP pour interroger les votes de l'Assemblée nationale (données CIVIX) depuis Claude, ChatGPT ou Gemini."
authors = [{ name = "Elyes Toumi" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.15,<4.0"
keywords = ["mcp", "assemblee-nationale", "deputes", "scrutins", "civix", "open-data", "claude", "chatgpt"]
dependencies = [
  "fastmcp (>=4.1,<5.0)",
  "pydantic (>=2.12,<2.14.2)",
  "httpx (>=0.28,<1.0)",
]

[project.urls]
repository = "https://github.com/Toumi-Elyes/mcp-assemblee-nationale"

[project.scripts]
mcp-assemblee-nationale = "assemblee_mcp.__main__:main"

[tool.poetry]
packages = [{ include = "assemblee_mcp", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0,<9.2"
pytest-asyncio = ">=1.3,<1.4.1"
respx = ">=0.23,<1.0"
ruff = ">=0.16,<0.17.3"
mypy = ">=2.3,<2.4.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py315"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PT", "ASYNC", "PL", "N"]
# TC : FastMCP et Pydantic lisent les annotations à l'exécution, les imports doivent rester réels.
ignore = ["PLR0913", "RUF001", "RUF002", "RUF003", "TC001", "TC002", "TC003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.15"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: appelle l'API CIVIX réelle (CIVIX_LIVE=1)"]
